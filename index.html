<style>

body{
overflow:hidden;

height:100vh;

/*==========================
PARTICULAS
==========================*/

#canvas{
position:fixed;

left:0;

}

/*==========================
FONDO
==========================*/

body::before{

content:"";
position:absolute;
width:100%;
height:100%;

background:

radial-gradient(circle,
 rgba(255,70,120,.12),
transparent 70%);

animation:pulse 6s infinite;

}

@keyframes pulse{

0%{
transform:scale(1);
opacity:.3;
}

50%{
transform:scale(1.2);
opacity:.8;
}

100%{
transform:scale(1);
opacity:.3;
}

}

/*==========================
REPRODUCTOR
==========================*/

.main{

position:absolute;

width:100%;
height:100%;

display:flex;
justify-content:center;
align-items:center;

}

.reproductor{

width:500px;

padding:45px;

background:rgba(20, 5, 10, 0);

backdrop-filter:blur(18px);

border-radius:30px;

border:1px solid rgba(255,100,140,.25);

box-shadow:

0 0 50px rgba(255,0,80,.25),

0 0 120px rgba(255,40,90,.12);

text-align:center;

}

/*==========================
VINILO
==========================*/

.disc{

width:320px;
height:320px;

margin:auto;

border-radius:50%;

overflow:hidden;

position:relative;

animation:spin 25s linear infinite;

box-shadow:

0 0 45px rgba(255,0,80,.35);

}

.disc img{

width:100%;
height:100%;

object-fit:cover;

}

.disc::after{

content:"";

position:absolute;

width:55px;
height:55px;

background:#111;

border-radius:50%;

top:50%;
left:50%;

transform:translate(-50%,-50%);

border:6px solid #9d1338;

}

/*==========================
TEXTO
==========================*/

.playing{

margin-bottom:30px;

color:#ffcad4;

letter-spacing:4px;

font-size:13px;

text-transform:uppercase;

}

.info{

margin-top:35px;

}

.info h1{

font-family:'Cormorant Garamond',serif;

font-size:52px;

color:#fff;

font-weight:700;

}

.info p{

margin-top:10px;

font-size:20px;

color:#ffc2d1;

}

/*==========================
BOTON
==========================*/

.control-btn{

margin-top:35px;

width:82px;
height:82px;

border:none;

border-radius:50%;

background:#98143d;

cursor:pointer;

color:white;

font-size:26px;

transition:.4s;

box-shadow:

0 0 20px rgba(255,40,80,.4);

}

.control-btn:hover{

transform:scale(1.12);

background:#bf1d4c;

box-shadow:

0 0 35px rgba(255,30,90,.7);

}

/*==========================
FRASE
==========================*/

.frase{

margin-top:35px;

font-family:'Cormorant Garamond',serif;

font-size:26px;

font-style:italic;

color:#ffe5ec;

opacity:.85;

}

/*==========================
CORAZONES
==========================*/

.heart{

position:absolute;

font-size:28px;

color:#ff6b81;

animation:float 10s linear infinite;

opacity:.6;

}

@keyframes float{

0%{

transform:
translateY(120vh)
scale(.5);

opacity:0;

}

15%{

opacity:.7;

}

100%{

transform:
translateY(-120vh)
scale(1.5);

opacity:0;

}

}

/*==========================
BRILLOS
==========================*/

.spark{

position:absolute;

width:4px;
height:4px;

background:white;

border-radius:50%;

box-shadow:
0 0 15px white;

animation:twinkle 2s infinite;

}

@keyframes twinkle{

0%{
opacity:.2;
transform:scale(.4);
}

50%{
opacity:1;
transform:scale(1.4);
}

100%{
opacity:.2;
transform:scale(.4);
}

}

/*==========================
VINILO
==========================*/

@keyframes spin{

from{
transform:rotate(0deg);
}

to{
transform:rotate(360deg);
}

}
.stickerImg{

position:fixed;

width:700px;
height:700px;

object-fit:contain;

z-index:20;

pointer-events:none;

filter:drop-shadow(0 0 35px #ff4d88);

animation:imagenMover 12s linear forwards;

}


@keyframes imagenMover{

0%{

left:-800px;

transform:
translateY(100vh)
rotate(-30deg)
scale(.5);

opacity:0;

}


20%{

opacity:1;

}


50%{

transform:
translateY(40vh)
rotate(20deg)
scale(1);

}


100%{

left:100vw;

transform:
translateY(-20vh)
rotate(360deg)
scale(.8);

opacity:0;

}


}
html,body{

<script>

const frases=[

"❤️ I love you so ❤️",

"✨ Eres mi persona favorita ✨",

"💗 Gracias por existir 💗",

"🌹 Mi mundo es más bonito contigo 🌹",

"💕 Siempre voy a elegirte 💕",

"⭐ Eres mi lugar seguro ⭐",

"💖 Contigo todo es especial 💖",

"🌙 Mi canción favorita eres tú 🌙",

"❤️ Te quiero muchísimo ❤️",

"✨ Mi corazón sonríe cuando pienso en ti ✨"

];


const container=document.getElementById("loveContainer");


function crearFrase(){


let texto=document.createElement("div");

texto.className="loveText";


texto.innerHTML=
frases[Math.floor(Math.random()*frases.length)];


texto.style.left=Math.random()*80+"%";


texto.style.animationDuration=
(8+Math.random()*8)+"s";


texto.style.fontSize=
(25+Math.random()*25)+"px";


container.appendChild(texto);



setTimeout(()=>{

texto.remove();

},16000);


}


setInterval(crearFrase,1200);



function crearStickerImagen(){

let img=document.createElement("img");

img.src=
imagenes[Math.floor(Math.random()*imagenes.length)];


img.className="stickerImg";


img.style.top=
Math.random()*70+"vh";


document.getElementById("imageStickers")
.appendChild(img);



setTimeout(()=>{

img.remove();

},10000);


}

setInterval(crearStickerImagen,1200);
const musicPlayer=document.getElementById("musicPlayer");
const playPauseBtn=document.getElementById("playPauseBtn");
const nextBtn=document.getElementById("nextBtn");
const prevBtn=document.getElementById("prevBtn");

const titulo=document.querySelector(".info h1");
const artista=document.querySelector(".info p");
const frase=document.querySelector(".frase");
const canciones=[

{
nombre:"Química Mayor",
artista:"Mon Laferte",
archivo:"Química Mayor - Mon Laferte.mp3",
frase:"Porque contigo todo sabe a Química Mayor ❤️"
},

{
nombre:"Nuestra Casa",
artista:"Mon Laferte",
archivo:"Mon Laferte - Nuestra Casa (Letra) - jostland.mp3",
frase:"Contigo cualquier lugar se siente como mi hogar 🏠✨"
},


{
nombre:"Niño",
artista:"Milo J",
archivo:"Milo J - Niño (Official Video) - MILOJVEVO.mp3",
frase:"Por lo menos podemos decir que fuimos fuertes"
},

{
nombre:"Amárrame",
artista:"Mon Laferte",
archivo:"Mon Laferte - Amárrame ft. Juanes - MonLaferteVEVO.mp3",
frase:"Hay conexiones que parecen hechas por el destino ❤️"
},

{
nombre:"Online",
artista:"Aria Bela",
archivo:"Aria Bela - Online (Official Video) - Aria Bela.mp3",
frase:"Puedo arrepentirme de todo menos de haberte conocido atraves de una pantalla ✨"
},

{
nombre:"Disfruto",
artista:"Carla Morrison",
archivo:"Carla Morrison - Disfruto (letra) - Carla Morrison.mp3",
frase:"Disfrutar cada momento contigo es un pequeño regalo 🌹"
},

{
nombre:"Eres",
artista:"Café Tacvba",
archivo:"Café Tacvba - Eres (Video Oficial) - CafeTacubaVEVO.mp3",
frase:"Hay personas que hacen que todo sea más bonito 💕"
},

{
nombre:"Vámonos a Marte",
artista:"Kevin Kaarl",
archivo:"Kevin Kaarl - Vamonos a Marte - Kevin Kaarl.mp3",
frase:"Aunque sea lejos, cualquier lugar contigo sería especial 🌌"
},

{
nombre:"Brillas",
artista:"León Larregui",
archivo:"León Larregui - Brillas - LeonLarreguiVEVO.mp3",
frase:"Algunas personas iluminan incluso los días más oscuros ✨"
}

];

let indice=0;
let reproduciendo=false;


function cargarCancion(){

musicPlayer.src=canciones[indice].archivo;

titulo.innerHTML=canciones[indice].nombre;

artista.innerHTML=canciones[indice].artista;

frase.innerHTML='"'+canciones[indice].frase+'"';

}


function reproducir(){

musicPlayer.play();

playPauseBtn.innerHTML="❚❚";

reproduciendo=true;

}


playPauseBtn.onclick=()=>{


if(reproduciendo){

musicPlayer.pause();

playPauseBtn.innerHTML="▶";

reproduciendo=false;


}else{

reproducir();

}

};



nextBtn.onclick=()=>{

indice++;

if(indice>=canciones.length){

indice=0;

}

cargarCancion();

reproducir();

};



prevBtn.onclick=()=>{


indice--;

if(indice<0){

indice=canciones.length-1;

}


cargarCancion();

reproducir();

};



musicPlayer.onended=()=>{

nextBtn.click();

};



cargarCancion();

</script>

<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

canvas.width=innerWidth;
canvas.height=innerHeight;

class Petalo{

constructor(){

this.reset();

}

reset(){

this.x=Math.random()*canvas.width;

this.y=-30;

this.size=Math.random()*18+10;

this.speed=Math.random()*1.5+0.5;

this.swing=Math.random()*2;

this.angle=Math.random()*6.28;

this.rotation=Math.random()*360;

}

update(){

this.y+=this.speed;

this.x+=Math.sin(this.angle)*this.swing;

this.angle+=0.02;

this.rotation+=1;

if(this.y>canvas.height+30){

this.reset();

}

this.draw();

}

draw(){

ctx.save();

ctx.translate(this.x,this.y);

ctx.rotate(this.rotation*Math.PI/180);

ctx.fillStyle="rgba(180,20,60,.85)";

ctx.beginPath();

ctx.moveTo(0,-this.size/2);

ctx.bezierCurveTo(
this.size/2,
-this.size,
this.size,
this.size/3,
0,
this.size
);

ctx.bezierCurveTo(
-this.size,
this.size/3,
-this.size/2,
-this.size,
0,
-this.size/2
);

ctx.fill();

ctx.restore();

}

}

const petalos=[];

for(let i=0;i<80;i++){

petalos.push(new Petalo());

}

function animate(){

ctx.clearRect(0,0,canvas.width,canvas.height);

petalos.forEach(p=>p.update());

requestAnimationFrame(animate);

}

animate();

window.onresize=()=>{

canvas.width=innerWidth;
canvas.height=innerHeight;

};

</script>
